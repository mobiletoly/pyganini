[project]
name = "pyganini-qualification-refactor-app"
version = "0.0.0"
requires-python = ">=3.13,<3.15"
dependencies = ["pyganini", "fastapi==0.141.1", "httpx2==2.12.0"]

[tool.pyganini]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["app/_pyganini"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
