[project]
name = "pyganini-foundation-probes"
version = "0.0.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "anyio==4.14.2",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "starlette==1.6.0",
]

[dependency-groups]
dev = [
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "httpx2==2.10.0",
    "mypy==2.3.1",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/declarations/*.py" = ["F821"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["tests/typing_samples/expected_failures.py"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
exclude = ["tests/typing_samples/expected_failures.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
